<div class="toolbar">
  <h2>Patient List</h2>
  <button mat-raised-button color="primary" (click)="refresh()">Refresh</button>
</div>
<!-- Spinner de carga -->
<mat-progress-spinner
  *ngIf="loading"
  mode="indeterminate"
  diameter="40"
  color="primary"
  class="spinner-center">
</mat-progress-spinner>

<!-- Mensaje de error -->
<mat-card *ngIf="error" class="error-message">
  <mat-icon>error</mat-icon>
  {{ error }}
</mat-card>

<mat-form-field appearance="outline" class="full-width">
  <mat-label>Search by Name</mat-label>
  <input matInput [(ngModel)]="nameFilter" (keyup.enter)="onSearch()" />
</mat-form-field>

<button mat-raised-button color="primary" (click)="onSearch()">Search</button>
<div *ngIf="!loading && !error">


<table mat-table [dataSource]="patients" class="mat-elevation-z8" style="margin-top: 1rem;">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let p">
      <a [routerLink]="['/patients', p.id]">{{ p.name }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="dateOfBirth">
    <th mat-header-cell *matHeaderCellDef>DOB</th>
    <td mat-cell *matCellDef="let p">{{ p.dateOfBirth | date }}</td>
  </ng-container>

  <ng-container matColumnDef="gender">
    <th mat-header-cell *matHeaderCellDef>Gender</th>
    <td mat-cell *matCellDef="let p">{{ p.gender }}</td>
  </ng-container>

  <ng-container matColumnDef="contactInfo">
    <th mat-header-cell *matHeaderCellDef>Contact</th>
    <td mat-cell *matCellDef="let p">{{ p.contactInfo }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator
  [length]="totalPatients"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 25]"
  (page)="onPageChange($event)">
</mat-paginator>
</div>
